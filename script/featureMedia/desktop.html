<!doctype html>
<!--
  The social media versions of the feature demos (see socialVideo.ts), as one timeline: the intro (the icon bounces and the window opens
  out of it), the recording in the window with the captions and zooms, and the outro, on a desktop with a photo. Everything is a function
  of the time, so socialVideo.ts steps it frame by frame with Chromium and screenshots each frame. The settings are JSON in the URL's hash.
  To design, open it in a browser: it plays with a placeholder for the recording, and the slider at the bottom scrubs it. Override
  settings in the hash, e.g. desktop.html#{"footer":"losslesscut.app"} or #{"kenBurns":{"zoom":0}} (see `defaults` below).
-->
<html>
<head>
<meta charset="utf-8">
<title>Feature media desktop</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow: hidden; background: #111; }
  body { font-family: Inter, system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; color: white; -webkit-font-smoothing: antialiased; }
  #scene { position: absolute; left: 0; top: 0; overflow: hidden; transform-origin: 0 0; }

  /* The photo, darkened a bit (most at the edges) so the window and the text stand out */
  #desktop { position: absolute; inset: 0; overflow: hidden; background: #1b2b33; }
  #desktop .photo { position: absolute; left: -12px; top: -12px; }
  #desktop::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.35) 100%); }

  /* A macOS style window in dark mode. Sizes are in macOS points times --s */
  #window { position: absolute; transform-origin: 0 0; border-radius: calc(12px * var(--s)); box-shadow: 0 calc(22px * var(--s)) calc(70px * var(--s)) calc(4px * var(--s)) rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(0, 0, 0, 0.5); }
  #titlebar { position: absolute; left: 0; top: 0; right: 0; border-radius: calc(12px * var(--s)) calc(12px * var(--s)) 0 0; background: linear-gradient(#3b3b3d, #333335); box-shadow: inset 0 1px rgba(255, 255, 255, 0.14); border-bottom: 1px solid #151515; }
  #titlebar .title { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: calc(13px * var(--s)); font-weight: 600; color: rgba(255, 255, 255, 0.82); letter-spacing: 0.01em; }
  #titlebar .lights { position: absolute; left: calc(13px * var(--s)); top: 0; bottom: 0; display: flex; align-items: center; gap: calc(8px * var(--s)); }
  #titlebar .lights span { width: calc(12px * var(--s)); height: calc(12px * var(--s)); border-radius: 50%; box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.25); }
  #titlebar .lights span:nth-child(1) { background: #ff5f57; }
  #titlebar .lights span:nth-child(2) { background: #febc2e; }
  #titlebar .lights span:nth-child(3) { background: #28c840; }
  /* The recording, zoomed with a transform. The placeholder (when designing) is a grid, to see the zooms */
  #content { position: absolute; left: 0; right: 0; bottom: 0; overflow: hidden; border-radius: 0 0 calc(12px * var(--s)) calc(12px * var(--s)); background: #222; }
  #recording { position: absolute; left: 0; top: 0; display: block; transform-origin: 0 0; }
  #recording.placeholder { background: linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px) 0 0 / 64px 64px, linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px) 0 0 / 64px 64px, linear-gradient(135deg, #2a2d33, #16171a); }

  /* The icon and two lines of text, in the intro and outro */
  #launcher { position: absolute; isolation: isolate; display: flex; flex-direction: column; align-items: center; text-align: center; }
  /* A soft shade behind it, so the text is readable on the bright sand */
  #launcher::before { content: ''; position: absolute; z-index: -1; left: 50%; top: 50%; width: min(90%, calc(var(--icon) * 6)); height: calc(var(--icon) * 2.6); transform: translate(-50%, -38%); background: radial-gradient(closest-side, rgba(0, 0, 0, 0.38), rgba(0, 0, 0, 0)); }
  #icon { display: block; transform-origin: 50% 100%; filter: drop-shadow(0 calc(var(--icon) * 0.06) calc(var(--icon) * 0.08) rgba(0, 0, 0, 0.45)); }
  #launcher .title { font-weight: 700; letter-spacing: -0.01em; text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55), 0 1px 3px rgba(0, 0, 0, 0.4); }
  #launcher .subtitle { font-weight: 500; color: rgba(255, 255, 255, 0.92); text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6), 0 1px 3px rgba(0, 0, 0, 0.45); }

  /* Above the window, growing upwards, and coming in from a bit lower (from the window) */
  .caption { position: absolute; left: 50%; width: max-content; transform-origin: 50% 100%; text-align: center; font-weight: 700; line-height: 1.25; padding: 0.45em 0.85em; border-radius: 0.55em; background: rgba(17, 17, 19, 0.82); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.08); }

  /* A subtle line under the window: the icon and e.g. the website */
  #footer { position: absolute; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 0.45em; line-height: 1.3; font-weight: 600; letter-spacing: 0.02em; color: rgba(255, 255, 255, 0.78); text-shadow: 0 1px 12px rgba(0, 0, 0, 0.6), 0 1px 3px rgba(0, 0, 0, 0.5); }
  #footer img { width: 1.3em; height: 1.3em; filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.5)); }

  /* The keys of an action's keyboard shortcut, as light keycaps. --p is how far they're pressed down (0 to 1) */
  .keys { position: absolute; display: flex; gap: 0.3em; transform-origin: 50% 100%; font-weight: 600; --p: 0; }
  .key { min-width: 1.85em; height: 1.85em; padding: 0 0.5em; display: flex; align-items: center; justify-content: center; border-radius: 0.28em; color: #2a2a2e; background: linear-gradient(#ffffff, #e6e6ea); transform: translateY(calc(0.12em * var(--p))); box-shadow: 0 calc(0.16em * (1 - 0.75 * var(--p))) 0 #a4a4ae, 0 calc(0.2em + 0.12em * (1 - var(--p))) calc(0.6em * (1 - 0.4 * var(--p))) rgba(0, 0, 0, 0.45), inset 0 -1px rgba(0, 0, 0, 0.06); }

  /* How long an export took, under the window */
  .exported { position: absolute; left: 50%; display: flex; align-items: center; gap: 0.45em; white-space: nowrap; font-weight: 600; line-height: 1.3; padding: 0.35em 0.9em 0.35em 0.5em; border-radius: 1em; background: rgba(17, 17, 19, 0.85); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.08); }
  .exported svg { width: 1.25em; height: 1.25em; }

  /* Only when designing: play/pause and a slider for the time */
  #scrubber { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: rgba(0, 0, 0, 0.8); font: 13px system-ui, sans-serif; }
  #scrubber input { flex: 1; }
  #scrubber output { min-width: 8em; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="scene">
  <div id="desktop"><canvas class="photo"></canvas></div>
  <div id="launcher"><div id="icon-launch"><img id="icon" alt=""></div><div class="title"></div><div class="subtitle"></div></div>
  <div id="window">
    <div id="content"><img id="recording" alt=""></div>
    <div id="titlebar"><div class="lights"><span></span><span></span><span></span></div><div class="title">LosslessCut</div></div>
  </div>
  <div id="captions"></div>
  <div id="footer"><img alt=""><span></span></div>
  <div id="badges"></div>
</div>
<script>
// The settings for designing in a browser. socialVideo.ts passes all of them
const defaults = {
  width: 1920,
  height: 1200,
  // Where the recording goes (the window's content, below the title bar), and the window's scale from macOS points
  content: { x: 224, y: 208, w: 1472, h: 920 },
  titleBarHeight: 40,
  scale: 1.4375,
  captionSize: 48,
  // Between the caption and the top of the window
  captionGap: 36,
  // Under the window, with the icon (e.g. 'losslesscut.app'), or none
  footer: undefined,
  // Between the bottom of the window and the footer
  footerGap: 22,
  // The recording: its size (the app's window), its length in seconds, and where its frames are (the URL up to the number,
  // for `${frames}00000.jpg` and on), or none for a placeholder
  recording: { width: 1024, height: 640, duration: 7, fps: 30, frames: undefined },
  // At times in the recording (in seconds)
  captions: [{ start: 0.5, end: 3, text: 'See every track in the file' }, { start: 3, end: 7, text: 'Choose the ones to keep' }],
  // From each time in the recording, zoomed in on a part of it (in the recording's pixels), or back out with no rect
  zooms: [{ time: 3, rect: { x: 60, y: 230, w: 560, h: 300 } }, { time: 5.5 }],
  // When the scenario ran an action with a keyboard shortcut, and its keys (see shortcuts.ts). They're shown on the desktop under
  // the window (at its right, beside the export times) or above it (and its captions), at keySize (their text's)
  keys: [{ time: 1, keys: ['I'] }, { time: 2.2, keys: ['⌥', '⇧', 'PgUp'] }, { time: 3.4, keys: ['⌘', 'E'] }, { time: 3.7, keys: ['⌘', 'E'] }],
  keysPlace: 'below',
  keySize: 46,
  // When an export finished, and how long it took (in seconds)
  exports: [{ time: 4.4, duration: 0.4 }],
  intro: { title: 'LosslessCut', subtitle: 'Choose which tracks to keep, then export' },
  outro: { title: 'losslesscut.app', subtitle: 'Free and open source · Windows, macOS and Linux' },
  // A slow zoom into the photo over the whole video (0.08 ends at 108 %, 0 turns it off), and a drift towards a side,
  // as a share of the room the zoom leaves there (-1 to 1)
  kenBurns: { zoom: 0.08, driftX: 0.4, driftY: -0.25 },
  // When designing (renders use the photo from backgrounds.ts): a resized version of the beach photo
  background: 'https://static.mifi.no/dist/2018/DJI_0120-edit-2000.jpg',
  icon: '../../src/renderer/src/icon.svg',
  // Set when rendering: no slider and no playing, socialVideo.ts calls timeline.seek() for each frame
  render: false,
};
const config = { ...defaults, ...(location.hash.length > 1 ? JSON.parse(decodeURIComponent(location.hash.slice(1))) : {}) };
const { width, height, content, titleBarHeight, scale, recording, kenBurns } = config;
const $ = (selector) => document.querySelector(selector);
const setStyle = (element, style) => Object.assign(element.style, style);
const px = (value) => `${value}px`;

setStyle($('#scene'), { width: px(width), height: px(height) });
document.documentElement.style.setProperty('--s', String(scale));
// The photo, covering the scene with a bit to spare for its blur. It's drawn once with its blur and colours, which would be slow to draw for each frame
const photo = $('#desktop .photo');
Object.assign(photo, { width: width + 24, height: height + 24 });
const photoImage = Object.assign(new Image(), { src: config.background });
async function drawPhoto() {
  await photoImage.decode();
  const context = photo.getContext('2d');
  const cover = Math.max(photo.width / photoImage.naturalWidth, photo.height / photoImage.naturalHeight);
  const [w, h] = [photoImage.naturalWidth * cover, photoImage.naturalHeight * cover];
  context.filter = 'blur(2px) saturate(1.05) brightness(0.82)';
  context.drawImage(photoImage, (photo.width - w) / 2, (photo.height - h) / 2, w, h);
}

// The window, around the content
const win = { x: content.x, y: content.y - titleBarHeight, w: content.w, h: content.h + titleBarHeight };
const windowElement = $('#window');
setStyle(windowElement, { left: px(win.x), top: px(win.y), width: px(win.w), height: px(win.h) });
setStyle($('#titlebar'), { height: px(titleBarHeight) });
setStyle($('#content'), { top: px(titleBarHeight) });
const recordingElement = $('#recording');
setStyle(recordingElement, { width: px(content.w), height: px(content.h) });
if (recording.frames == null) recordingElement.classList.add('placeholder');

// The captions go above the window, growing upwards
const captions = config.captions.map(({ start, end: recordedEnd, text }) => {
  // Gone by the outro (the recording's frames can end a bit before the time it was recorded for)
  const end = Math.min(recordedEnd, recording.duration);
  const element = document.createElement('div');
  element.className = 'caption';
  element.textContent = text;
  setStyle(element, { fontSize: px(config.captionSize), bottom: px(height - win.y + config.captionGap), maxWidth: px(width - 120) });
  $('#captions').append(element);
  return { start, end, element };
});

// The footer goes under the window
const footer = $('#footer');
footer.querySelector('span').textContent = config.footer ?? '';
footer.querySelector('img').src = config.icon;
setStyle(footer, { fontSize: px(Math.round(config.captionSize * 0.65)), top: px(win.y + win.h + config.footerGap) });
if (!config.footer) footer.style.display = 'none';

// The keys: one after the other in the same place. Presses of the same keys soon after each other press them again
const keyHold = 1.1;
const keyGroups = [];
for (const { time, keys } of config.keys) {
  const last = keyGroups.at(-1);
  if (last != null && last.keys.join() === keys.join() && time - last.presses.at(-1) < keyHold) last.presses.push(time);
  else keyGroups.push({ keys, presses: [time] });
}
for (const [i, group] of keyGroups.entries()) {
  group.element = document.createElement('div');
  group.element.className = 'keys';
  group.element.style.fontSize = px(config.keySize);
  for (const key of group.keys) {
    const element = document.createElement('div');
    element.className = 'key';
    element.textContent = key;
    group.element.append(element);
  }
  $('#badges').append(group.element);
  // Gone when the next ones come, and by the outro
  group.start = group.presses[0];
  group.end = Math.min(group.presses.at(-1) + keyHold + 0.2, keyGroups[i + 1]?.presses[0] ?? Infinity, recording.duration);
}

// Each export's time, with a check mark, under the window (instead of the footer, while it's shown)
const exportBadges = config.exports.map(({ time, duration: exportDuration }) => {
  const element = document.createElement('div');
  element.className = 'exported';
  element.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#2fbf71"/><path d="M6.5 12.5l3.5 3.5 7.5-8" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span></span>';
  element.querySelector('span').textContent = `Exported in ${exportDuration < 10 ? Math.max(0.1, exportDuration).toFixed(1) : Math.round(exportDuration)} s`;
  element.style.fontSize = px(Math.round(config.captionSize * 0.65));
  $('#badges').append(element);
  // It can last into the outro, where it goes with the window
  return { start: time, end: time + 2.6, element };
});

// Where the keys and export times go, once the text is laid out (with the fonts loaded)
function placeBadges() {
  const windowBottom = win.y + win.h;
  // Just under the window, or as low as there's room for
  for (const { element } of exportBadges) element.style.top = px(Math.min(windowBottom + config.footerGap, height - 12 - element.offsetHeight));
  const exportsWidth = Math.max(0, ...exportBadges.map(({ element }) => element.offsetWidth));
  for (const { element } of keyGroups) {
    // Smaller if it doesn't fit: under the window, between the export times (in the middle) and the window's right edge
    const room = config.keysPlace === 'above' ? width - 2 * win.x : win.x + win.w - (width + exportsWidth) / 2 - 24;
    if (element.offsetWidth > room) element.style.fontSize = px(config.keySize * (room / element.offsetWidth));
    if (config.keysPlace === 'above') {
      // Above the highest caption, if there are captions
      const captionsHeight = Math.max(0, ...captions.map((caption) => caption.element.offsetHeight + config.captionGap * 0.6));
      setStyle(element, { left: px((width - element.offsetWidth) / 2), bottom: px(height - win.y + config.captionGap + captionsHeight) });
    } else {
      setStyle(element, { left: px(win.x + win.w - element.offsetWidth), top: px(windowBottom + config.footerGap * 0.7) });
    }
  }
}

// The icon, at the middle of the window, with the text under it
const iconSize = Math.round(Math.min(width, height) * 0.16);
const icon = $('#icon');
icon.src = config.icon;
setStyle(icon, { width: px(iconSize), height: px(iconSize) });
document.documentElement.style.setProperty('--icon', px(iconSize));
const iconCenter = { x: win.x + win.w / 2, y: win.y + win.h / 2 - iconSize * 0.45 };
const launcher = $('#launcher');
setStyle(launcher, { left: px(iconCenter.x - width / 2), width: px(width), top: px(iconCenter.y - iconSize / 2), padding: '0 60px' });
const iconLaunch = $('#icon-launch');
const [titleText, subtitleText] = [$('#launcher .title'), $('#launcher .subtitle')];
setStyle(titleText, { fontSize: px(iconSize * 0.3), marginTop: px(iconSize * 0.16) });
setStyle(subtitleText, { fontSize: px(Math.max(iconSize * 0.16, config.captionSize * 0.75)), marginTop: px(iconSize * 0.05) });

// Easings of a progress from 0 to 1, like CSS's
function cubicBezier(x1, y1, x2, y2) {
  const at = (a, b, t) => 3 * a * t * (1 - t) ** 2 + 3 * b * t ** 2 * (1 - t) + t ** 3;
  return (x) => {
    // The t where the curve is at x (its x only grows with t)
    let low = 0;
    let high = 1;
    for (let i = 0; i < 30; i += 1) {
      const mid = (low + high) / 2;
      if (at(x1, x2, mid) < x) low = mid;
      else high = mid;
    }
    return at(y1, y2, (low + high) / 2);
  };
}
const linear = (p) => p;
const ease = { in: cubicBezier(0.42, 0, 1, 1), out: cubicBezier(0, 0, 0.58, 1), inOut: cubicBezier(0.42, 0, 0.58, 1) };
const smoothstep = (p) => p * p * (3 - 2 * p);
// A spring that overshoots a little (about 4 %) and settles. Frequency is per animation duration
function spring({ damping = 0.72, frequency = 7.9 } = {}) {
  const decay = damping * frequency;
  const damped = frequency * Math.sqrt(1 - damping ** 2);
  return (p) => (p >= 1 ? 1 : 1 - Math.exp(-decay * p) * (Math.cos(damped * p) + (decay / damped) * Math.sin(damped * p)));
}

// The eased progress (0 to 1) of an animation at a time, in seconds
const progress = (time, start, duration, easing = ease.inOut) => easing(Math.min(1, Math.max(0, (time - start) / duration)));
const mix = (from, to, p) => from + (to - from) * p;
// Keyframes of numbers at offsets from 0 to 1, each with the easing to the next one (like the Web Animations API's)
function keyframes(p, frames) {
  const i = Math.max(0, frames.findLastIndex(({ offset }) => offset <= p));
  const from = frames[i];
  const to = frames[Math.min(i + 1, frames.length - 1)];
  if (to === from) return from.values;
  const local = (from.easing ?? linear)((p - from.offset) / (to.offset - from.offset));
  return from.values.map((value, j) => mix(value, to.values[j], local));
}

// The timeline, in seconds: the intro ends on the recording's first frame and the outro starts on its last frame
const intro = { open: 1.45, duration: 2.4 };
const outro = { close: 0.15, duration: 2.5 };
const recordingStart = intro.duration;
const outroStart = recordingStart + recording.duration;
const duration = outroStart + outro.duration;

// The window's transform towards the icon: at 1 it's over the icon, at the icon's width
const fromIconScale = iconSize / win.w;
const atIcon = { x: iconCenter.x - win.x - (win.w * fromIconScale) / 2, y: iconCenter.y - win.y - (win.h * fromIconScale) / 2 };
const towardsIcon = (p) => `translate(${mix(0, atIcon.x, p)}px, ${mix(0, atIcon.y, p)}px) scale(${mix(1, fromIconScale, p)})`;

// The window, footer and launcher (the icon and its text) at a time of the intro and outro
function introAt(time) {
  const { open } = intro;
  // The icon bounces once, like an app being launched in the Dock, while the text is read
  const [bounce, squashX, squashY] = keyframes(progress(time, 0.55, 0.6, linear), [
    { offset: 0, values: [0, 1, 1], easing: cubicBezier(0.2, 0.6, 0.35, 1) },
    { offset: 0.45, values: [-0.42, 1, 1], easing: cubicBezier(0.6, 0, 0.85, 0.4) },
    { offset: 0.82, values: [0, 1, 1] },
    { offset: 0.9, values: [0, 1.05, 0.95] },
    { offset: 1, values: [0, 1, 1] },
  ]);
  // Then the window opens out of it, and the footer comes with it
  const text = 1 - progress(time, open - 0.1, 0.3);
  const launch = progress(time, open, 0.3, ease.in);
  return {
    window: { transform: towardsIcon(1 - progress(time, open, 0.75, spring())), opacity: progress(time, open, 0.18, linear) },
    footer: progress(time, open + 0.3, 0.45),
    icon: `translateY(${bounce * iconSize}px) scale(${squashX}, ${squashY})`,
    launch: { opacity: 1 - launch, transform: `scale(${mix(1, 1.6, launch)})` },
    text: config.intro,
    title: { opacity: text, transform: 'none' },
    subtitle: { opacity: text, transform: 'none' },
  };
}
function outroAt(time) {
  const { close } = outro;
  // The window closes into the icon and the footer goes with it, then the text comes (the footer's is the same), to read
  const [launchOpacity, launchScale] = keyframes(progress(time, close + 0.3, 0.45, ease.out), [{ offset: 0, values: [0, 0.6] }, { offset: 0.6, values: [1, 1.06] }, { offset: 1, values: [1, 1] }]);
  const textIn = (start) => {
    const p = progress(time, start, 0.4, ease.out);
    return { opacity: p, transform: `translateY(${mix(12, 0, p)}px)` };
  };
  return {
    window: { transform: towardsIcon(progress(time, close, 0.5, cubicBezier(0.55, 0, 0.75, 0.3))), opacity: 1 - progress(time, close + 0.36, 0.14, linear) },
    footer: 1 - progress(time, close, 0.35),
    icon: 'none',
    launch: { opacity: launchOpacity, transform: `scale(${launchScale})` },
    text: config.outro,
    title: textIn(close + 0.75),
    subtitle: textIn(close + 0.9),
  };
}
// While the recording plays
const playing = { window: { transform: 'none', opacity: 1 }, footer: 1, icon: 'none', launch: { opacity: 0, transform: 'none' }, text: config.intro, title: { opacity: 0, transform: 'none' }, subtitle: { opacity: 0, transform: 'none' } };

// The zoom (from 1) and the top left of the part of the recording that's shown, at a time in the recording.
// Each zoom eases there from the one before, and stays inside the recording
const zoomDuration = 0.7;
const maxZoom = 2.5;
function zoomAt(time) {
  const { width: w, height: h } = recording;
  let view = { zoom: 1, x: w / 2, y: h / 2 };
  for (const { time: start, rect } of config.zooms) {
    if (time < start) break;
    const target = rect == null ? { zoom: 1, x: w / 2, y: h / 2 } : { zoom: Math.max(1, Math.min(maxZoom, w / rect.w, h / rect.h)), x: rect.x + rect.w / 2, y: rect.y + rect.h / 2 };
    const p = progress(time, start, zoomDuration, smoothstep);
    view = { zoom: mix(view.zoom, target.zoom, p), x: mix(view.x, target.x, p), y: mix(view.y, target.y, p) };
    if (p < 1) break;
  }
  const { zoom, x, y } = view;
  const clamp = (value, max) => Math.min(max, Math.max(0, value));
  return { zoom, left: clamp(x - w / zoom / 2, w - w / zoom), top: clamp(y - h / zoom / 2, h - h / zoom) };
}

// A caption fades in while it comes up a bit and grows to its size, and fades out
function captionAt(time, { start, end }) {
  const shown = progress(time, start, 0.3, ease.out);
  const opacity = Math.min(shown, 1 - progress(time, end - 0.25, 0.25, linear));
  return { opacity, transform: `translateX(-50%) translateY(${mix(0.25 * config.captionSize, 0, shown)}px) scale(${mix(0.96, 1, shown)})` };
}

// Keys pop up and are pressed down (again at each press), then fade out
const easeOutBack = cubicBezier(0.34, 1.56, 0.64, 1);
function keysAt(time, { start, end, presses }) {
  const shown = progress(time, start, 0.22, easeOutBack);
  const opacity = Math.min(progress(time, start, 0.1, linear), 1 - progress(time, end - 0.2, 0.2, linear));
  // Down quickly, up a bit slower. The first press comes once they're up
  const pressed = Math.max(...presses.map((press, i) => {
    const at = press + (i === 0 ? 0.18 : 0);
    return Math.min(progress(time, at, 0.06, linear), 1 - progress(time, at + 0.1, 0.14, ease.out));
  }));
  return { opacity, transform: `translateY(${mix(0.3 * config.keySize, 0, shown)}px) scale(${mix(0.7, 1, shown)})`, pressed };
}

// An export time pops up and fades out
function exportAt(time, { start, end }) {
  const shown = progress(time, start, 0.35, easeOutBack);
  const opacity = Math.min(progress(time, start, 0.15, linear), 1 - progress(time, end - 0.3, 0.3, linear));
  return { opacity, transform: `translateX(-50%) translateY(${mix(0.4 * config.captionSize, 0, shown)}px) scale(${mix(0.85, 1, shown)})` };
}

let shownFrame;

// Shows the timeline at a time (in seconds). Resolves when the recording's frame is decoded, so it's in the next screenshot
async function seek(time) {
  // The recording stays on its first frame in the intro and on its last in the outro, with the zoom and captions it has there
  const recordingTime = Math.min(Math.max(time - recordingStart, 0), recording.duration);
  let scene = playing;
  if (time < recordingStart) scene = introAt(time);
  else if (time >= outroStart) scene = outroAt(time - outroStart);
  setStyle(windowElement, { transform: scene.window.transform, opacity: String(scene.window.opacity) });
  // The export times show instead of the footer
  let exportShown = 0;
  for (const badge of exportBadges) {
    const { opacity, transform } = exportAt(time - recordingStart, badge);
    setStyle(badge.element, { opacity: String(opacity * scene.footer), transform });
    exportShown = Math.max(exportShown, opacity);
  }
  footer.style.opacity = String(scene.footer * (1 - exportShown));
  for (const group of keyGroups) {
    const { opacity, transform, pressed } = keysAt(recordingTime, group);
    setStyle(group.element, { opacity: String(opacity), transform });
    group.element.style.setProperty('--p', String(pressed));
  }
  icon.style.transform = scene.icon;
  setStyle(iconLaunch, { opacity: String(scene.launch.opacity), transform: scene.launch.transform });
  if (titleText.textContent !== scene.text.title) titleText.textContent = scene.text.title;
  if (subtitleText.textContent !== scene.text.subtitle) subtitleText.textContent = scene.text.subtitle;
  setStyle(titleText, { opacity: String(scene.title.opacity), transform: scene.title.transform });
  setStyle(subtitleText, { opacity: String(scene.subtitle.opacity), transform: scene.subtitle.transform });

  for (const caption of captions) {
    const { opacity, transform } = captionAt(recordingTime, caption);
    setStyle(caption.element, { opacity: String(opacity), transform });
  }

  // The content zooms (the title bar stays)
  const { zoom, left, top } = zoomAt(recordingTime);
  recordingElement.style.transform = `translate(${-left * zoom * (content.w / recording.width)}px, ${-top * zoom * (content.h / recording.height)}px) scale(${zoom})`;

  // The photo zooms in slowly over the whole video, and drifts within the room that leaves
  const room = (kenBurns.zoom * (time / duration)) / 2;
  photo.style.transform = `translate(${kenBurns.driftX * room * 100}%, ${kenBurns.driftY * room * 100}%) scale(${1 + 2 * room})`;

  if (recording.frames != null) {
    const frame = Math.min(Math.round(recordingTime * recording.fps), Math.round(recording.duration * recording.fps) - 1);
    if (frame !== shownFrame) {
      shownFrame = frame;
      recordingElement.src = `${recording.frames}${String(frame).padStart(5, '0')}.jpg`;
      await recordingElement.decode();
    }
  }
}

globalThis.timeline = {
  // Fonts and images loaded, and the start shown. When rendering, a missing image fails the render (when designing, it's just left out)
  ready: Promise.all([document.fonts.ready, icon.decode(), drawPhoto()].map(async (loaded) => (config.render ? loaded : loaded.catch(() => undefined)))).then(async () => {
    placeBadges();
    await seek(0);
  }),
  duration,
  seek,
};

// Designing: play it over and over, or scrub it with the slider. The scene is scaled down to fit in the browser
if (!config.render) {
  const bar = document.createElement('div');
  bar.id = 'scrubber';
  bar.innerHTML = '<button type="button">Pause</button><input type="range" min="0" step="0.001"><output></output>';
  document.body.append(bar);
  const [button, slider, output] = bar.children;
  slider.max = String(duration);
  const fit = () => { $('#scene').style.transform = `scale(${Math.min(1, innerWidth / width, (innerHeight - bar.offsetHeight) / height)})`; };
  fit();
  addEventListener('resize', fit);
  let isPlaying = true;
  let time = 0;
  let last = performance.now();
  const show = () => {
    seek(time);
    slider.value = String(time);
    output.value = `${time.toFixed(2)} / ${duration.toFixed(2)} s`;
  };
  const setPlaying = (value) => {
    isPlaying = value;
    button.textContent = isPlaying ? 'Pause' : 'Play';
  };
  button.addEventListener('click', () => setPlaying(!isPlaying));
  slider.addEventListener('input', () => {
    setPlaying(false);
    time = Number(slider.value);
    show();
  });
  const tick = (now) => {
    if (isPlaying) {
      // With a second's pause at the end
      time = (time + (now - last) / 1000) % (duration + 1);
      show();
    }
    last = now;
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
