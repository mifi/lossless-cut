<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- LosslessCut: a film strip with one clean cut, and a marker at the cut point -->
  <defs>
    <linearGradient id="llc-bg" x1="24" y1="24" x2="488" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset=".45" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <radialGradient id="llc-sheen" cx="120" cy="80" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="llc-glow" cx="440" cy="470" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".6"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="llc-strip" x1="0" y1="188" x2="0" y2="324" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#ede9fe"/>
    </linearGradient>
    <!-- the film strip, with sprocket holes and the slanted cut taken out -->
    <mask id="llc-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect x="80" y="188" width="352" height="136" rx="34" fill="#fff"/>
      <g fill="#000">
        <rect x="108" y="204" width="22" height="16" rx="5"/>
        <rect x="150" y="204" width="22" height="16" rx="5"/>
        <rect x="192" y="204" width="22" height="16" rx="5"/>
        <rect x="298" y="204" width="22" height="16" rx="5"/>
        <rect x="340" y="204" width="22" height="16" rx="5"/>
        <rect x="382" y="204" width="22" height="16" rx="5"/>
        <rect x="108" y="292" width="22" height="16" rx="5"/>
        <rect x="150" y="292" width="22" height="16" rx="5"/>
        <rect x="192" y="292" width="22" height="16" rx="5"/>
        <rect x="298" y="292" width="22" height="16" rx="5"/>
        <rect x="340" y="292" width="22" height="16" rx="5"/>
        <rect x="382" y="292" width="22" height="16" rx="5"/>
        <path d="M254 166h38l-30 180h-38z"/>
      </g>
    </mask>
    <filter id="llc-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="10" result="blur"/>
      <feFlood flood-color="#1e1b4b" flood-opacity=".45"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#llc-bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#llc-glow)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#llc-sheen)"/>
  <rect x="26" y="26" width="460" height="460" rx="110" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="4"/>

  <g filter="url(#llc-shadow)">
    <rect x="80" y="188" width="352" height="136" rx="34" fill="url(#llc-strip)" mask="url(#llc-cut)"/>
    <!-- marker pointing at the cut -->
    <path d="M252 104h42a8 8 0 0 1 6.4 12.8l-21 28a8 8 0 0 1-12.8 0l-21-28A8 8 0 0 1 252 104z" fill="#fff"/>
  </g>
</svg>
